name: Apply prepared media tree

on:
  push:
    branches:
      - codex/media-site-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Create commit from prepared tree and fast-forward branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tree = '0dec4b8a8b84c60a00a5792efbbff38915f7eb97';
            const { owner, repo } = context.repo;
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'feat: コーポレートサイトをメディア型CMSへ再設計',
              tree,
              parents: [context.sha],
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: 'heads/codex/media-site-v1',
              sha: commit.data.sha,
              force: false,
            });
            core.info(`Applied prepared tree with commit ${commit.data.sha}`);
